org: worldiary
service: coursary-api
frameworkVersion: '4.43.0'

provider: ${file(./sls/provider.yml)}

custom: ${file(./sls/custom.yml)}

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.js
    # sharp comes from its layer, on processUpload only: external alone would put it in every zip (Q387).
    external:
      - sharp
      - '!@aws-sdk/s3-presigned-post'
      - '!@aws-sdk/s3-request-presigner'
    exclude:
      - '@aws-sdk/*'
      - sharp

layers:
  Sharp:
    name: ${self:service}-${sls:stage}-sharp
    description: sharp and its libvips binaries for Linux arm64 (glibc)
    path: layers/sharp
    compatibleRuntimes:
      - nodejs24.x
    compatibleArchitectures:
      - arm64

functions:
  - ${file(./sls/functions/health.yml)}
  - ${file(./sls/functions/auth.yml)}
  - ${file(./sls/functions/account.yml)}
  - ${file(./sls/functions/admin.yml)}
  - ${file(./sls/functions/course.yml)}
  - ${file(./sls/functions/outline.yml)}
  - ${file(./sls/functions/catalog.yml)}
  - ${file(./sls/functions/enrollment.yml)}
  - ${file(./sls/functions/review.yml)}
  - ${file(./sls/functions/stream.yml)}
  - ${file(./sls/functions/mail.yml)}
  - ${file(./sls/functions/file.yml)}
  - ${file(./sls/functions/export.yml)}

resources:
  - ${file(./sls/resources/dynamodb/MainTable.yml)}
  - ${file(./sls/resources/sqs/Queues.yml)}
  - ${file(./sls/resources/s3/Buckets.yml)}
  - ${file(./sls/resources/cloudfront/Distribution.yml)}
  - ${file(./sls/resources/monitoring/Alarms.yml)}
  - ${file(./sls/resources/cognito/UserPool.yml)}
  - ${file(./sls/resources/api-gateway/CustomDomain.yml)}
  - ${file(./sls/resources/api-gateway/Throttling.yml)}
