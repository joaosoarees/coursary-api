AWSTemplateFormatVersion: '2010-09-09'
Description: Access for coursary-api. A deployer role assumed from the owner's user and by GitHub Actions in the dev environment, a permissionless CI role for every workflow of the repository, and the role that deploys coursary-web's build.

Parameters:
  OwnerUserName:
    Type: String
    Description: IAM user allowed to assume the deployer role.
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone of the API's custom domain.
  DeploymentBucketName:
    Type: String
    Default: serverless-framework-deployments-sa-east-1-59910092-c003
  # The site's distribution, created by the API stack; its id is in /coursary-api/dev/site/distribution-id.
  SiteDistributionId:
    Type: String
    Default: E2NO0T89TMH6E2

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  CiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-api-ci
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: repo:joaosoarees@59843125/coursary-api@1416276221:*
      # Only a stack that is never deployed: with a layer, `sls package` describes the
      # stage's stack and tolerates only "does not exist". Nothing real is readable.
      Policies:
        - PolicyName: package-bundles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/coursary-api-bundles/*

  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: coursary-api-boundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: logs:*
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/coursary-api-*
          - Effect: Allow
            Action: dynamodb:*
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coursary-api-*
          - Effect: Allow
            Action: cognito-idp:*
            Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
          - Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::coursary-api-*
              - arn:aws:s3:::coursary-api-*/*
          - Effect: Allow
            Action: sqs:*
            Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:coursary-api-*
          - Effect: Allow
            Action: ssm:GetParameter*
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/*
          # Domain e-mails sent by the application itself.
          - Effect: Allow
            Action: ses:SendEmail
            Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          # SecureString parameters, only when the call comes through SSM.
          - Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-api-deployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:user/${OwnerUserName}
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:joaosoarees@59843125/coursary-api@1416276221:environment:dev
      Policies:
        - PolicyName: deploy-broad
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/coursary-api-*/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:aws:s3:::${DeploymentBucketName}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${DeploymentBucketName}/serverless/coursary-api/*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/serverless-framework/*
              - Effect: Allow
                Action: ssm:*
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/*
              - Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coursary-api-*
              - Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeLimits
                  - dynamodb:ListStreams
                Resource: '*'
              - Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:coursary-api-*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:coursary-api-*
              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:ListEventSourceMappings
                  - lambda:ListFunctions
                  - lambda:ListLayers
                  - lambda:ListLayerVersions
                  - lambda:GetLayerVersion
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: '*'
              - Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/coursary-api-*
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                Resource: '*'
              - Effect: Allow
                Action: apigateway:*
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames
                  - !Sub arn:aws:apigateway:${AWS::Region}::/domainnames/*
              - Effect: Allow
                Action: cognito-idp:*
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:ListUserPools
                  - cognito-idp:DescribeUserPoolDomain
                Resource: '*'
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::coursary-api-*
                  - arn:aws:s3:::coursary-api-*/*
              - Effect: Allow
                Action: sqs:*
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:coursary-api-*
              - Effect: Allow
                Action: sns:*
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:coursary-api-*
              - Effect: Allow
                Action: cloudwatch:*
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:coursary-api-*
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudfront:*
                  - acm:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                Resource: !Sub arn:aws:route53:::hostedzone/${HostedZoneId}
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action:
                  - ses:Get*
                  - ses:List*
                  - ses:Describe*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref Boundary
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:DeleteRole
                  - iam:UpdateRoleDescription
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-*
              - Effect: Deny
                Action: iam:*
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-deployer
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/coursary-api-ci

  # coursary-web's CI in its dev environment: uploads the build to the site's bucket, invalidates
  # index.html and reads where both are. Nothing else.
  WebDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: coursary-web-deployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:joaosoarees@59843125/coursary-web@1439867542:environment:dev
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::coursary-api-dev-site-${AWS::AccountId}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::coursary-api-dev-site-${AWS::AccountId}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistributionId}
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/dev/site/*

Outputs:
  CiRoleArn:
    Value: !GetAtt CiRole.Arn
  DeployerRoleArn:
    Value: !GetAtt DeployerRole.Arn
  BoundaryArn:
    Value: !Ref Boundary
  WebDeployerRoleArn:
    Value: !GetAtt WebDeployerRole.Arn
