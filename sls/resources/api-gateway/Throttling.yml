# Past these limits the gateway answers 429 without invoking the function. A search spends one
# request of the Algolia plan; a question or an answer reaches every reader of the lesson.
extensions:
  HttpApiStage:
    DependsOn:
      - HttpApiRouteGetSearch
      - HttpApiRoutePostCoursesCourseidVarLessonsLessonidVarQuestions
      - HttpApiRoutePostCoursesCourseidVarLessonsLessonidVarQuestionsQuestionidVarAnswers
    Properties:
      RouteSettings:
        GET /search:
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        POST /courses/{courseId}/lessons/{lessonId}/questions:
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        POST /courses/{courseId}/lessons/{lessonId}/questions/{questionId}/answers:
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
  # A new stage's default is the whole account's quota: one noisy client could starve the HTTP API.
  WebsocketsDeploymentStage:
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
