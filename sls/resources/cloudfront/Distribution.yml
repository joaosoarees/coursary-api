Resources:
  AssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: ${self:service}-${sls:stage}-public-assets
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Avatar and cover variants on the default domain. Their keys carry a content hash
  # and S3 sends `immutable`, which CachingOptimized honours, so nothing is ever invalidated.
  AssetsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ${self:service}-${sls:stage} public assets
        # The only class with edge locations in South America.
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: public-assets
            DomainName: !GetAtt PublicAssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AssetsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: public-assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
