Resources:
  # Lambda can only send the position of a lost stream batch to a standard queue (Q296).
  StreamFailuresQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-stream-failures
      MessageRetentionPeriod: 1209600

  # FIFO by course, so two changes of one course are indexed in order (Q316).
  CatalogIndexQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-index.fifo
      FifoQueue: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CatalogIndexDLQ.Arn
        maxReceiveCount: 5

  CatalogIndexDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-index-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Standard: deleting a Cognito user twice changes nothing (Q341).
  CognitoCleanupQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-cognito-cleanup
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CognitoCleanupDLQ.Arn
        maxReceiveCount: 5

  CognitoCleanupDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-cognito-cleanup-dlq
      MessageRetentionPeriod: 1209600
