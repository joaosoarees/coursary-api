Resources:
  # Lambda can only send the position of a lost stream batch to a standard queue.
  StreamFailuresQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-stream-failures
      MessageRetentionPeriod: 1209600

  # FIFO by course, so two changes of one course are indexed in order.
  CatalogIndexQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-index.fifo
      FifoQueue: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CatalogIndexDLQ.Arn
        maxReceiveCount: 5

  CatalogIndexDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-index-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Standard: deleting a Cognito user twice changes nothing.
  CognitoCleanupQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-cognito-cleanup
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CognitoCleanupDLQ.Arn
        maxReceiveCount: 5

  CognitoCleanupDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-cognito-cleanup-dlq
      MessageRetentionPeriod: 1209600

  # Standard: the consumer's claim sends each e-mail once.
  MailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-mail
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MailDLQ.Arn
        maxReceiveCount: 5

  MailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-mail-dlq
      MessageRetentionPeriod: 1209600

  # Standard: a repeated page only finds less to delete.
  CourseDeletionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-course-deletion
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CourseDeletionDLQ.Arn
        maxReceiveCount: 5

  CourseDeletionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-course-deletion-dlq
      MessageRetentionPeriod: 1209600

  # Standard: the job reads the export first, so a repeated message writes nothing new.
  StudentExportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-student-export
      # Six times the job's timeout, as AWS recommends for a Lambda consumer.
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StudentExportDLQ.Arn
        maxReceiveCount: 5

  StudentExportDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-student-export-dlq
      MessageRetentionPeriod: 1209600

  # Standard: S3 cannot send to a FIFO queue, and the consumer reads the FILE before acting.
  UploadsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-uploads
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UploadsDLQ.Arn
        maxReceiveCount: 5

  UploadsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-uploads-dlq
      MessageRetentionPeriod: 1209600

  # Only the private bucket of this account may send.
  UploadsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: ${file(./sls/config/buckets.yml):privateFiles.arn}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
