Resources:
  # Originals, read only through presigned URLs and by the upload consumer.
  PrivateFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: ${self:custom.stages.${sls:stage}.bucketDeletionPolicy, 'Delete'}
    # S3 checks that it may send to the queue when the notification is saved.
    DependsOn: UploadsQueuePolicy
    Properties:
      BucketName: ${file(./sls/config/buckets.yml):privateFiles.name}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # The browser sends uploads straight here: the presigned POST of images and material, the
      # PUT of each video part, whose ETag the page must read to complete.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - ${file(./sls/config/site.yml):origin}
            AllowedMethods:
              - POST
              - PUT
            AllowedHeaders:
              - content-type
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      # A student CSV lasts as long as its record's TTL.
      LifecycleConfiguration:
        Rules:
          - Id: expire-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7
          # A video upload never completed nor aborted keeps its parts, billed, until this.
          - Id: abort-forgotten-uploads
            Status: Enabled
            Prefix: lesson/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Every upload the presigned POST lets through goes to the consumer.
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt UploadsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: account/
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt UploadsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: course/
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt UploadsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: lesson/

  # Processed variants, read only by the CDN.
  PublicAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: ${self:custom.stages.${sls:stage}.bucketDeletionPolicy, 'Delete'}
    Properties:
      BucketName: ${file(./sls/config/buckets.yml):publicAssets.name}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # Only this account's distribution: without the condition any distribution with OAC could read it.
  PublicAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${PublicAssetsBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AssetsDistribution}
