reviewCourse:
  handler: src/main/functions/review/reviewCourse.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.put}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.conditionCheck}
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/review
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

getMyReview:
  handler: src/main/functions/review/getMyReview.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/review
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

listCourseReviews:
  handler: src/main/functions/review/listCourseReviews.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.queryGsi1}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/reviews
