createModule:
  handler: src/main/functions/outline/createModule.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/modules
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

updateModule:
  handler: src/main/functions/outline/updateModule.handler
  events:
    - httpApi:
        method: PATCH
        path: /courses/{courseId}/modules/{moduleId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

deleteModule:
  handler: src/main/functions/outline/deleteModule.handler
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}/modules/{moduleId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

createLesson:
  handler: src/main/functions/outline/createLesson.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/modules/{moduleId}/lessons
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

updateLesson:
  handler: src/main/functions/outline/updateLesson.handler
  events:
    - httpApi:
        method: PATCH
        path: /courses/{courseId}/modules/{moduleId}/lessons/{lessonId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

# The lesson in one transaction, then its material: objects, then records (Q416).
deleteLesson:
  handler: src/main/functions/outline/deleteLesson.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
    PUBLIC_ASSETS_BUCKET: ${file(./sls/config/buckets.yml):publicAssetsBucket}
  iam:
    role:
      statements:
        # The caller, the course and the lesson; the transaction; the lesson's files.
        - ${file(./sls/config/table.yml):statements.readQueryAndChange}
        - ${file(./sls/config/buckets.yml):statements.listBothBuckets}
        - ${file(./sls/config/buckets.yml):statements.deleteLessonOriginals}
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}/modules/{moduleId}/lessons/{lessonId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

getOutline:
  handler: src/main/functions/outline/getOutline.handler
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/outline
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

reorderOutline:
  handler: src/main/functions/outline/reorderOutline.handler
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/outline
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
