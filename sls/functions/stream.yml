routeTableChanges:
  handler: src/main/functions/stream/routeTableChanges.handler
  timeout: 30
  environment:
    CATALOG_INDEX_QUEUE_URL: ${file(./sls/config/catalogIndexQueue.yml):environment.CATALOG_INDEX_QUEUE_URL}
    COGNITO_CLEANUP_QUEUE_URL: !Ref CognitoCleanupQueue
  iam:
    role:
      statements:
        - ${file(./sls/config/catalogIndexQueue.yml):statements.send}
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt CognitoCleanupQueue.Arn
  events:
    - stream:
        type: dynamodb
        arn: !GetAtt MainTable.StreamArn
        batchSize: 100
        maximumRetryAttempts: 2
        bisectBatchOnFunctionError: true
        destinations:
          onFailure:
            type: sqs
            arn: !GetAtt StreamFailuresQueue.Arn
        # The removal has no new image, so it is matched on the old one.
        filterPatterns:
          - dynamodb:
              NewImage:
                type:
                  S: [Course, CourseDescription]
          - eventName: [REMOVE]
            dynamodb:
              OldImage:
                type:
                  S: [Course, CourseDescription]
          # A pending account the TTL removed: its Cognito user goes too (Q341).
          - eventName: [REMOVE]
            userIdentity:
              type: [Service]
              principalId: [dynamodb.amazonaws.com]
            dynamodb:
              OldImage:
                type:
                  S: [Account]
                status:
                  S: [PENDING]
