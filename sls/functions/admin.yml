promoteAdmin:
  handler: src/main/functions/admin/promoteAdmin.handler
  timeout: 5
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndWrite}

listAccounts:
  handler: src/main/functions/admin/listAccounts.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.queryGsi1}
  events:
    - httpApi:
        method: GET
        path: /admin/users
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

findAccountByEmail:
  handler: src/main/functions/admin/findAccountByEmail.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
  events:
    - httpApi:
        method: GET
        path: /admin/users/by-email
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

changeRole:
  handler: src/main/functions/admin/changeRole.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.put}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.conditionCheck}
  events:
    - httpApi:
        method: PUT
        path: /admin/users/{accountId}/role
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

listRoleChanges:
  handler: src/main/functions/admin/listRoleChanges.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
  events:
    - httpApi:
        method: GET
        path: /admin/users/{accountId}/role-changes
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

disableAccount:
  handler: src/main/functions/admin/disableAccount.handler
  environment:
    WEBSOCKETS_API_ENDPOINT: ${file(./sls/config/realtime.yml):environment.WEBSOCKETS_API_ENDPOINT}
    WEBSOCKETS_API_ID: ${file(./sls/config/realtime.yml):environment.WEBSOCKETS_API_ID}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.conditionCheck}
        - ${file(./sls/config/table.yml):statements.queryGsi2}
        - ${file(./sls/config/table.yml):statements.delete}
        - ${file(./sls/config/realtime.yml):statements.closeConnections}
  events:
    - httpApi:
        method: POST
        path: /admin/users/{accountId}/disable
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

enableAccount:
  handler: src/main/functions/admin/enableAccount.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.conditionCheck}
  events:
    - httpApi:
        method: POST
        path: /admin/users/{accountId}/enable
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
