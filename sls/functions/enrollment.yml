enroll:
  handler: src/main/functions/enrollment/enroll.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.put}
        - ${file(./sls/config/table.yml):statements.update}
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/enrollment
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

cancelEnrollment:
  handler: src/main/functions/enrollment/cancelEnrollment.handler
  environment:
    WEBSOCKETS_API_ENDPOINT: ${file(./sls/config/realtime.yml):environment.WEBSOCKETS_API_ENDPOINT}
    WEBSOCKETS_API_ID: ${file(./sls/config/realtime.yml):environment.WEBSOCKETS_API_ID}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndUpdate}
        - ${file(./sls/config/table.yml):statements.queryGsi2}
        - ${file(./sls/config/table.yml):statements.delete}
        - ${file(./sls/config/realtime.yml):statements.closeConnections}
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}/enrollment
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

listMyEnrollments:
  handler: src/main/functions/enrollment/listMyEnrollments.handler
  environment: ${file(./sls/config/cdn.yml):environment}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.queryGsi2}
        - ${file(./sls/config/table.yml):statements.batchGet}
  events:
    - httpApi:
        method: GET
        path: /me/enrollments
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

listCourseStudents:
  handler: src/main/functions/enrollment/listCourseStudents.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.queryGsi1}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/students
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

openLesson:
  handler: src/main/functions/enrollment/openLesson.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
        # S3 checks the signer's permission when the player's GET arrives.
        - ${file(./sls/config/buckets.yml):statements.readLessonOriginals}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/lessons/{lessonId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

completeLesson:
  handler: src/main/functions/enrollment/completeLesson.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.put}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.conditionCheck}
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/lessons/{lessonId}/completion
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

getProgress:
  handler: src/main/functions/enrollment/getProgress.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/progress
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

savePosition:
  handler: src/main/functions/enrollment/savePosition.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.put}
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/position
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
