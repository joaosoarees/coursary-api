createCourse:
  handler: src/main/functions/course/createCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

updateCourse:
  handler: src/main/functions/course/updateCourse.handler
  events:
    - httpApi:
        method: PATCH
        path: /courses/{courseId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

listMyCourses:
  handler: src/main/functions/course/listMyCourses.handler
  events:
    - httpApi:
        method: GET
        path: /instructor/courses
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

publishCourse:
  handler: src/main/functions/course/publishCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/publish
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

archiveCourse:
  handler: src/main/functions/course/archiveCourse.handler
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/archive
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

deleteCourse:
  handler: src/main/functions/course/deleteCourse.handler
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

# Deletes a draft marked DELETING one page per message (Q371, Q372).
deleteCourseContent:
  handler: src/main/functions/course/deleteCourseContent.handler
  timeout: 60
  environment:
    COURSE_DELETION_QUEUE_URL: !Ref CourseDeletionQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:DeleteItem
          Resource: !GetAtt MainTable.Arn
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt CourseDeletionQueue.Arn
  events:
    - sqs:
        arn: !GetAtt CourseDeletionQueue.Arn
        batchSize: 5
        functionResponseType: ReportBatchItemFailures

# Records a pending cover and signs its POST (Q399, Q402).
requestCoverUpload:
  handler: src/main/functions/course/requestCoverUpload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource: !GetAtt MainTable.Arn
        # S3 checks the signer's permission when the POST arrives, on the original's key only.
        - Effect: Allow
          Action: s3:PutObject
          Resource: ${file(./sls/config/buckets.yml):courseOriginals}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/cover
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
