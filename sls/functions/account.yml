getMe:
  handler: src/main/functions/account/getMe.handler
  environment: ${file(./sls/config/cdn.yml):environment}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
  events:
    - httpApi:
        method: GET
        path: /me
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

updateMe:
  handler: src/main/functions/account/updateMe.handler
  environment: ${file(./sls/config/cdn.yml):environment}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
        - ${file(./sls/config/table.yml):statements.query}
        - ${file(./sls/config/table.yml):statements.update}
        - ${file(./sls/config/table.yml):statements.queryGsi1}
  events:
    - httpApi:
        method: PATCH
        path: /me
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

requestAvatarUpload:
  handler: src/main/functions/account/requestAvatarUpload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/uploadRequests.yml):statements.recordFile}
        # S3 checks the signer's permission when the POST arrives, on the original's key only.
        - Effect: Allow
          Action: s3:PutObject
          Resource: ${file(./sls/config/buckets.yml):accountOriginals}
  events:
    - httpApi:
        method: POST
        path: /me/avatar
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

getAvatarUpload:
  handler: src/main/functions/account/getAvatarUpload.handler
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.read}
  events:
    - httpApi:
        method: GET
        path: /me/avatar/{fileId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
