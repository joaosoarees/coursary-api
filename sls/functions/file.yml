processUpload:
  handler: src/main/functions/file/processUpload.handler
  # sharp's peak for the largest image let through, measured by the s3-image-processing-sharp skill.
  memorySize: 1024
  timeout: 30
  layers:
    - !Ref SharpLambdaLayer
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
    PUBLIC_ASSETS_BUCKET: ${file(./sls/config/buckets.yml):publicAssetsBucket}
    # glibc otherwise keeps what each image used, and a warm process grows until it is killed.
    MALLOC_MMAP_THRESHOLD_: '131072'
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readQueryAndChange}
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - ${file(./sls/config/buckets.yml):accountOriginals}
            - ${file(./sls/config/buckets.yml):courseOriginals}
            - ${file(./sls/config/buckets.yml):lessonOriginals}
        # A missing original answers NoSuchKey instead of AccessDenied.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: !GetAtt PrivateFilesBucket.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - ${file(./sls/config/buckets.yml):accountAssets}
            - ${file(./sls/config/buckets.yml):courseAssets}
  events:
    - sqs:
        arn: !GetAtt UploadsQueue.Arn
        batchSize: 5
        functionResponseType: ReportBatchItemFailures
        # The lowest Lambda allows: images wait in the queue instead of piling up in memory.
        maximumConcurrency: 2

requestAttachmentUpload:
  handler: src/main/functions/file/requestAttachmentUpload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:PutItem
          Resource: !GetAtt MainTable.Arn
        - ${file(./sls/config/buckets.yml):statements.putLessonOriginals}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/lessons/{lessonId}/attachments
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

getAttachmentDownload:
  handler: src/main/functions/file/getAttachmentDownload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
        # S3 checks the signer's permission when the GET arrives.
        - ${file(./sls/config/buckets.yml):statements.readLessonOriginals}
  events:
    - httpApi:
        method: GET
        path: /courses/{courseId}/lessons/{lessonId}/attachments/{fileId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

deleteAttachment:
  handler: src/main/functions/file/deleteAttachment.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readQueryAndDelete}
        - ${file(./sls/config/buckets.yml):statements.deleteLessonOriginals}
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}/lessons/{lessonId}/attachments/{fileId}
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

reorderAttachments:
  handler: src/main/functions/file/reorderAttachments.handler
  events:
    - httpApi:
        method: PUT
        path: /courses/{courseId}/lessons/{lessonId}/attachments/order
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

requestVideoUpload:
  handler: src/main/functions/file/requestVideoUpload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:PutItem
            - dynamodb:DeleteItem
          Resource: !GetAtt MainTable.Arn
        - ${file(./sls/config/buckets.yml):statements.putLessonOriginals}
        - ${file(./sls/config/buckets.yml):statements.abortLessonUploads}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/lessons/{lessonId}/video
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

# Signs a batch of part URLs; signing calls no AWS, S3 checks the role when each PUT arrives.
signVideoParts:
  handler: src/main/functions/file/signVideoParts.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
        - ${file(./sls/config/buckets.yml):statements.putLessonOriginals}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/lessons/{lessonId}/video/part-urls
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

completeVideoUpload:
  handler: src/main/functions/file/completeVideoUpload.handler
  # S3 may take minutes to join the parts: the API answers at 30 s, the function finishes.
  timeout: 120
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readAndQuery}
        - ${file(./sls/config/buckets.yml):statements.putLessonOriginals}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/lessons/{lessonId}/video/complete
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

abortVideoUpload:
  handler: src/main/functions/file/abortVideoUpload.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readQueryAndDelete}
        - ${file(./sls/config/buckets.yml):statements.abortLessonUploads}
  events:
    - httpApi:
        method: POST
        path: /courses/{courseId}/lessons/{lessonId}/video/abort
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}

deleteVideo:
  handler: src/main/functions/file/deleteVideo.handler
  environment:
    PRIVATE_FILES_BUCKET: ${file(./sls/config/buckets.yml):privateFilesBucket}
  iam:
    role:
      statements:
        - ${file(./sls/config/table.yml):statements.readQueryAndDelete}
        - ${file(./sls/config/buckets.yml):statements.deleteLessonOriginals}
  events:
    - httpApi:
        method: DELETE
        path: /courses/{courseId}/lessons/{lessonId}/video
        authorizer: ${file(./sls/config/privateAuthorizer.yml)}
