statements:
  read:
    Effect: Allow
    Action: dynamodb:GetItem
    Resource: !GetAtt MainTable.Arn
  readAndWrite:
    Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:PutItem
      - dynamodb:UpdateItem
    Resource: !GetAtt MainTable.Arn
  readAndUpdate:
    Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:UpdateItem
    Resource: !GetAtt MainTable.Arn
  queryGsi1:
    Effect: Allow
    Action: dynamodb:Query
    Resource: !Join ['/', [!GetAtt MainTable.Arn, 'index', 'GSI1']]
  readAndQuery:
    Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
    Resource: !GetAtt MainTable.Arn
  readQueryAndDelete:
    Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:DeleteItem
    Resource: !GetAtt MainTable.Arn
  readQueryAndChange:
    Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
    Resource: !GetAtt MainTable.Arn
