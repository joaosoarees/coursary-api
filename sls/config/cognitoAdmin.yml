statements:
  # ListUsers to read, so the user is not counted as active this month (MAU).
  cleanup:
    Effect: Allow
    Action:
      - cognito-idp:ListUsers
      - cognito-idp:AdminDeleteUser
    Resource: !GetAtt UserPool.Arn
  checkUser:
    Effect: Allow
    Action: cognito-idp:AdminGetUser
    Resource: !GetAtt UserPool.Arn
  deleteUser:
    Effect: Allow
    Action: cognito-idp:AdminDeleteUser
    Resource: !GetAtt UserPool.Arn
