environment:
  ALGOLIA_PARAMETERS_PATH: /coursary-api/${sls:stage}/algolia
  CATALOG_INDEX_NAME: ${sls:stage}_courses

# One statement per function kind, so each names only the key it may read (Q303, Q331).
statements:
  indexer:
    Effect: Allow
    Action: ssm:GetParameter
    Resource:
      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/${sls:stage}/algolia/app-id
      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/${sls:stage}/algolia/write-key
  search:
    Effect: Allow
    Action: ssm:GetParameter
    Resource:
      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/${sls:stage}/algolia/app-id
      - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coursary-api/${sls:stage}/algolia/search-key
  # SecureString parameters, only when the call comes through SSM (Q305).
  decrypt:
    Effect: Allow
    Action: kms:Decrypt
    Resource: '*'
    Condition:
      StringEquals:
        kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
