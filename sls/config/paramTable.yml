# The main stack's table seen from another stack, whose ARN comes from the main stack's outputs.
statements:
  read:
    Effect: Allow
    Action: dynamodb:GetItem
    Resource: ${param:mainTableArn}
  put:
    Effect: Allow
    Action: dynamodb:PutItem
    Resource: ${param:mainTableArn}
  delete:
    Effect: Allow
    Action: dynamodb:DeleteItem
    Resource: ${param:mainTableArn}
  queryGsi1:
    Effect: Allow
    Action: dynamodb:Query
    Resource: ${param:mainTableArn}/index/GSI1
  queryGsi2:
    Effect: Allow
    Action: dynamodb:Query
    Resource: ${param:mainTableArn}/index/GSI2
