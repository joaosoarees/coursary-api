# Names as text, never !Ref or !GetAtt: the uploads queue policy names the private bucket,
# and a reference there would close the cycle bucket → queue policy → bucket (Q391).
privateFiles:
  name: !Sub coursary-api-${sls:stage}-private-files-${AWS::AccountId}
  arn: !Sub arn:aws:s3:::coursary-api-${sls:stage}-private-files-${AWS::AccountId}
publicAssets:
  name: !Sub coursary-api-${sls:stage}-public-assets-${AWS::AccountId}

# For the functions that sign or read the originals of accounts, courses and lessons (Q392, Q402, Q409); they are outside
# that cycle, so references are fine here.
privateFilesBucket: !Ref PrivateFilesBucket
accountOriginals: !Sub ${PrivateFilesBucket.Arn}/account/*
courseOriginals: !Sub ${PrivateFilesBucket.Arn}/course/*
lessonOriginals: !Sub ${PrivateFilesBucket.Arn}/lesson/*
publicAssetsBucket: !Ref PublicAssetsBucket
accountAssets: !Sub ${PublicAssetsBucket.Arn}/account/*
courseAssets: !Sub ${PublicAssetsBucket.Arn}/course/*

statements:
  # Listing an owner's prefix in both buckets, to delete what is there (Q418, Q419).
  listBothBuckets:
    Effect: Allow
    Action: s3:ListBucket
    Resource:
      - !GetAtt PrivateFilesBucket.Arn
      - !GetAtt PublicAssetsBucket.Arn
