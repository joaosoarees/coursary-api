name: aws
region: sa-east-1
runtime: nodejs24.x
architecture: arm64
# Measured step by step from the 1024 MB default.
memorySize: 512
versionFunctions: false
# Logs kept long enough to look into an incident; before, no group expired.
logRetentionInDays: 30
logs:
  lambda:
    logFormat: JSON
    applicationLogLevel: INFO
    systemLogLevel: INFO
  # No header, body or token: only what places a request and says how it ended.
  httpApi:
    format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency","integrationErrorMessage":"$context.integrationErrorMessage"}'
environment: ${file(./sls/config/env.yml)}
httpApi:
  disableDefaultEndpoint: ${strToBool(${env:DISABLE_DEFAULT_APIGW_ENDPOINT, 'false'})}
  # Only the front calls from a browser, with the session cookie; locally it goes through the
  # Vite proxy, so no localhost here.
  cors:
    allowedOrigins:
      - ${file(./sls/config/site.yml):origin}
    allowCredentials: true
    allowedHeaders:
      - Content-Type
      - Authorization
    allowedMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    maxAge: 600
  authorizers:
    CognitoAuthorizer:
      type: jwt
      identitySource: $request.header.Authorization
      issuerUrl: !GetAtt UserPool.ProviderURL
      audience:
        - !Ref UserPoolClient
websocketsApiRouteSelectionExpression: $request.body.action
deploymentBucket:
  name: ${self:custom.deploymentBucket}
iam:
  role:
    mode: perFunction
    permissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/coursary-api-boundary
