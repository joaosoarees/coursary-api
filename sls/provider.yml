name: aws
region: sa-east-1
runtime: nodejs24.x
architecture: arm64
# Measured step by step from the 1024 MB default (Q291).
memorySize: 512
versionFunctions: false
# Logs kept long enough to look into an incident; before, no group expired (Q456).
logRetentionInDays: 30
environment: ${file(./sls/config/env.yml)}
httpApi:
  disableDefaultEndpoint: ${strToBool(${env:DISABLE_DEFAULT_APIGW_ENDPOINT, 'false'})}
  # Only the front calls from a browser, with the session cookie; locally it goes through the
  # Vite proxy, so no localhost here (Q484).
  cors:
    allowedOrigins:
      - ${file(./sls/config/site.yml):origin}
    allowCredentials: true
    allowedHeaders:
      - Content-Type
      - Authorization
    allowedMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    maxAge: 600
  authorizers:
    CognitoAuthorizer:
      type: jwt
      identitySource: $request.header.Authorization
      issuerUrl: !GetAtt UserPool.ProviderURL
      audience:
        - !Ref UserPoolClient
deploymentBucket:
  name: ${self:custom.deploymentBucket}
iam:
  role:
    permissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/coursary-api-boundary
    statements: ${file(./sls/config/role.yml):statements}
